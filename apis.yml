aid: plume
name: Plume
description: >-
  Plume Design, Inc. is a SaaS platform for internet service providers,
  delivering managed WiFi, network intelligence, and cyber-security services to
  ISP subscribers at global scale. Its product suite includes Haystack (network
  intelligence and observability), Plume Home (residential WiFi and cyber
  protection), WorkPass (small-business connectivity), Uprise (multi-dwelling-unit
  WiFi management), and Sweepr (AI-orchestrated ISP customer support). Plume is
  the primary sponsor of OpenSync, an open-source software-defined-networking
  framework for CPE and consumer networking devices that exposes northbound cloud
  APIs. Backed by SoftBank Vision Fund.
